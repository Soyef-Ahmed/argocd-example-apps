apiVersion: v1
kind: Service
metadata:
  name: prod-helm-redis
spec:
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    app: prod-helm-redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prod-helm-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prod-helm-redis
  template:
    metadata:
      labels:
        app: prod-helm-redis
    spec:
      containers:
        - image: redis:7.4-alpine
          name: redis
          ports:
            - containerPort: 6379
